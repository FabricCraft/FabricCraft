[package]
name = "fabriccraft-cli"
default-run = "fabriccraft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fabriccraft-core = { path = "../../crates/fabriccraft-core" }
tobj = { version = "=4.0.5", default-features = false, features = ["use_f64"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }

[features]
gui = ["dep:eframe"]

[[bin]]
name = "fabriccraft-gui"
path = "src/bin/fabriccraft-gui.rs"
required-features = ["gui"]

[lints]
workspace = true
